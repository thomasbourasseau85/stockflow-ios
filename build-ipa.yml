name: Build STOCKFLOW iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project STOCKFLOW.xcodeproj

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project STOCKFLOW.xcodeproj \
            -scheme STOCKFLOW \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/STOCKFLOW.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          /usr/bin/zip -qry STOCKFLOW-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: STOCKFLOW-unsigned-IPA
          path: build/STOCKFLOW-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
